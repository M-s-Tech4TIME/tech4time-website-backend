# Push to main, and the site changes. Nothing is typed into cPanel.
#
# WHAT MAKES THIS SAFE, IN ORDER
#   1. test.yml has to have passed — the same checks a person runs by hand.
#   2. The upload set is BUILT by tools/build_deploy_set.py, not described by
#      flags typed here. An allow list decides what goes; nothing new ships
#      by accident.
#   3. rsync runs once with --dry-run and the output is read by a gate before
#      anything is written. The gate looks for deletions under paths the panel
#      owns, and fails the job rather than the site.
#   4. content/ is seeded with --ignore-existing, never synced. THIS host's
#      content/ is the system of record — the public site holds a replica —
#      so what is here always wins over anything a deploy carries.
#   5. verify_live.py asks the running site whether the rules that protect it
#      are still there.
#
# Step 3 is the one that matters. The filters in step 4 are what prevent the
# deletions; the gate is a separate check that they did. Do not remove it on
# the grounds that the filters make it redundant — that is exactly the
# reasoning that removes the last thing standing between a deploy and a
# client's data.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. Two rsyncs into the same document root interleave
# their writes, and the loser is whichever finishes second.
concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: build the upload set
        run: |
          python3 tools/build_deploy_set.py --check
          python3 tools/build_deploy_set.py --out _deploy

      # Every secret arrives through env rather than being pasted into the
      # script by ${{ }}. The values here are trusted, but the habit is not
      # about these values — a secret interpolated into a shell line is one
      # rename away from being a command.
      - name: ssh
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Pinned rather than trusted on first use. ssh-keyscan into
          # known_hosts on every run accepts whatever answers, which is not a
          # check — it is a formality that would welcome an impostor. This
          # fails closed if the host key ever changes.
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'echo connected as $(whoami), target $(ls -d ~/admin.tech4time.bd)'

      # Everything the host owns and the repository does not. None of it is in
      # _deploy/site, so --delete would remove all of it. 'P' is 'protect':
      # do not delete this on the receiver. See docs/90-decisions/0016.
      #
      # The target is the directory cPanel made for the subdomain, and the
      # document root is public/ INSIDE it — so this rsync --delete runs over a
      # directory the panel also writes to. cgi-bin is protected because cPanel
      # recreates it; .well-known because AutoSSL answers ACME challenges from
      # the document root, and a deploy landing mid-issue would delete the
      # challenge and the certificate would silently fail to renew — months
      # later, with nothing to connect it to.
      #
      # .well-known IS PROTECTED IN BOTH PLACES, and that is not belt and
      # braces. cPanel created the subdomain with its document root at
      # ~/admin.tech4time.bd and put .well-known there; the document root then
      # moved one level in, to public/. Which of the two AutoSSL writes to next
      # depends on when it last read the subdomain's configuration, and being
      # wrong about it is a certificate that stops renewing. Both cost nothing
      # to keep.
      # public/.htaccess is NOT protected: this repository ships it, and if
      # cPanel's Directory Privacy has written its own there, that is a
      # configuration to switch off before deploying rather than a file to
      # preserve — see the note at the end of public/.htaccess.
      - name: the protect list
        run: |
          cat > /tmp/protect.rules <<'RULES'
          P /content/
          P /public/uploads/
          P /.well-known/
          P /public/.well-known/
          P /cgi-bin/
          P error_log
          P /.user.ini
          P /php.ini
          RULES
          cat /tmp/protect.rules

      - name: dry run
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          rsync -az --delete --itemize-changes --dry-run \
            --filter='merge /tmp/protect.rules' \
            -e "ssh -i ~/.ssh/deploy -p $SSH_PORT -o BatchMode=yes" \
            _deploy/site/ "$SSH_USER@$SSH_HOST:~/admin.tech4time.bd/" | tee /tmp/plan.txt
          echo
          echo "proposed deletions:"
          grep '^\*deleting' /tmp/plan.txt || echo "  (none)"

      - name: refuse to delete what the panel owns
        run: |
          set -euo pipefail
          # Read from the plan, not from the filter file. The filters are what
          # should prevent this; this is the independent check that they did.
          # The whitespace matters. --itemize-changes pads the flag field, so
          # the line reads "*deleting   content/careers.json" with three
          # spaces, and a pattern expecting one silently matches nothing —
          # a gate that always passes, which is worse than no gate at all.
          # Caught by running this against a deliberately unprotected plan.
          # public/uploads/ IS ON THIS LIST NOW AND WAS NOT. The protect rule
          # above has named it since ADR 0019, while this gate -- whose entire
          # purpose is to be an INDEPENDENT check that the filters worked -- did
          # not. And it matters more on this half than on the other: this is
          # where pictures are AUTHORED. The public site holds a replica that a
          # reconcile can rebuild; these are the originals, and they are in no
          # repository.
          if grep -E '^\*deleting[[:space:]]+(content/|public/uploads/|\.well-known/|public/\.well-known/|cgi-bin/|([^[:space:]]*/)?error_log|\.user\.ini|php\.ini)' /tmp/plan.txt; then
            echo "::error::The deploy proposed deleting something the host owns. Refusing."
            echo "content/ here is the SYSTEM OF RECORD — every job post and contact"
            echo "detail the client has written. The public site holds a replica of it."
            echo "public/uploads/ is where every picture was ACCEPTED — the originals,"
            echo "held in no repository and rebuildable from nowhere."
            echo "Nothing has been written to the server. Fix the protect list and re-run."
            exit 1
          fi
          echo "Nothing protected is proposed for deletion."

      - name: sync the site
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          rsync -az --delete --itemize-changes \
            --filter='merge /tmp/protect.rules' \
            -e "ssh -i ~/.ssh/deploy -p $SSH_PORT -o BatchMode=yes" \
            _deploy/site/ "$SSH_USER@$SSH_HOST:~/admin.tech4time.bd/"

      # --ignore-existing is the whole content rule: it creates what is absent
      # and overwrites nothing. A file already on the host was written by
      # somebody in the editor and wins, permanently, without anyone having to
      # decide so on the day. No --delete here, ever.
      #
      # This is a SEED, not a migration. If the public site already had content
      # when this host was built, that content had to be copied here by hand
      # before the first save — see docs/20-deployment/first-deploy.md. A seed
      # arriving over an empty content/ on a host that should have inherited
      # one is how the first save publishes an empty document over the live
      # site.
      - name: seed content, only where there is none
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          rsync -az --ignore-existing --itemize-changes \
            -e "ssh -i ~/.ssh/deploy -p $SSH_PORT -o BatchMode=yes" \
            _deploy/seed/ "$SSH_USER@$SSH_HOST:~/admin.tech4time.bd/content/"

      # The 404s matter more than the 200s here, and they must be 404s: lib/,
      # sections/ and content/ are OUTSIDE the document root, so a request for
      # them reaches nothing rather than reaching a rule that refuses. A 403
      # would mean the subdomain's document root is pointed one level too high
      # and the whole shape of this repository has been undone silently.
      - name: ask the admin whether it is still shaped right
        run: python3 tools/verify_live.py https://admin.tech4time.bd

      - name: forget the key
        if: always()
        run: rm -f ~/.ssh/deploy ~/.ssh/known_hosts
