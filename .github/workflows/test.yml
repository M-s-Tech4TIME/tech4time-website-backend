# Every check this repository has, run on the machine rather than on a promise.
#
# THIS IS THE BACKEND. The public site's pages, its renderers and the browser
# crawls over them are in tech4time-website-frontend's workflow of the same name.
# Neither list is the whole suite any more, and neither pretends to be:
# check_content_model.py and check_docs.py each print which half they ran.
#
# The pre-commit list in docs/10-development/testing.md is what a person is
# asked to run. This is the same list run by something that cannot forget, and
# deploy.yml requires it: what gates a merge and what gates a release are the
# same set of checks, deliberately, so that "it passed on my machine" and "it
# is safe to put on the server" stop being two different claims.
name: test

on:
  # dev only. A push to main is a release, and deploy.yml calls this workflow
  # itself — listing main here too would run every check twice for one merge
  # and report the answer in two places.
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Called by deploy.yml, so a release runs the same checks a merge does
  # rather than a second list that can drift from this one.
  workflow_call:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Printed, not asserted. The host runs PHP 8.2.33 and the runner will
      # drift ahead of it; that is worth seeing in the log rather than
      # discovering when something passes here and fails there.
      - name: versions
        run: |
          python3 -V
          php -v | head -1

      - run: python3 tools/check_contrast.py
      - run: python3 tools/check_css.py
      - run: python3 tools/check_content_model.py
      - run: python3 tools/check_secrets.py
      - run: python3 tools/check_docs.py
      - run: python3 tools/build_deploy_set.py --check
      # The four files both repositories hold identically -- including the icon
      # sprite, because CONTACT_ICONS is in the contract and an icon this side
      # offers must be one the other side can draw. Hygiene, not a guarantee:
      # the guarantee is CONTRACT_VERSION, checked at run time by the endpoint
      # this half posts to.
      - run: python3 tools/check_shared_lib.py
      # A fact stated in two documents at once -- the offices, the email and the
      # telephone are authored in BOTH the privacy policy and the contact page,
      # on purpose. This asks whether they still agree. It can only see the
      # committed seed: content edited in the admin never passes through git.
      - run: python3 tools/check_shared_facts.py
      - run: python3 tools/check_form_dom.py

      # And the thing the line above structurally cannot see: whether the OTHER
      # half still holds the same bytes. A per-repo digest passes happily while
      # the two sanitisers differ. This clones the sibling and compares them.
      # It is the only place that check happens anywhere.
      - run: python3 tools/check_shared_repos.py --clone

  server:
    name: php
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # These drive a real PHP server and a real sign-in, served from public/
      # exactly as the host serves it, with the private store beside the
      # checkout the same way it lands beside the deploy target on the host.
      #
      # The three that publish do so to tools/publish_stub.py -- an
      # implementation of the wire format written a second time, in Python,
      # from its description. Pointing them at the other repository's endpoint
      # would check the two halves against each other rather than against the
      # format they both implement.
      - run: php -v | head -1

      # The host has GD; ubuntu-24.04's php-cli does not. lib/upload.php is the
      # only code in either repository that takes a file from somebody's
      # computer and puts it on a web server, and the thing that makes it safe
      # is that it DECODES and RE-ENCODES rather than inspecting and approving.
      # Without GD, tools/test_upload.py skips exactly the cases that prove it —
      # so it is installed here rather than left to skip in the one place a
      # regression would be caught.
      - name: php-gd, so the uploader is actually tested
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-gd
          php -r 'exit(extension_loaded("gd") ? 0 : 1);' \
            || { echo "php-gd did not load"; exit 1; }

      # The hosts have ext-dom; ubuntu-24.04's php-cli does not. lib/svg.php is
      # the security boundary for every vector file this site publishes — it is
      # what turns "an SVG is a document that can carry script" into something
      # that can be served at all — and without a parser it refuses everything,
      # which would make tools/test_svg.py pass for the wrong reason. Installed
      # here rather than left to skip in the one place a regression would be
      # caught. Same bargain as php-gd.
      - name: php-xml, so the SVG sanitiser is actually tested
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-xml
          php -r 'exit(class_exists("DOMDocument") ? 0 : 1);' \
            || { echo "php-xml did not load"; exit 1; }

      - run: python3 tools/test_svg.py
      - run: python3 tools/test_store.py
      - run: python3 tools/test_upload.py
      - run: python3 tools/test_admin_auth.py
      - run: python3 tools/test_publish_client.py
      - run: python3 tools/test_careers_admin.py
      - run: python3 tools/test_contact_admin.py
      - run: python3 tools/test_company_admin.py
      # These three were in the repository but not here, so the about, home and
      # services editors were only ever tested by somebody remembering to run
      # them. A test that CI does not run is a test that stops being true
      # quietly.
      - run: python3 tools/test_about_admin.py
      - run: python3 tools/test_home_admin.py
      - run: python3 tools/test_services_admin.py
      - run: python3 tools/test_certifications_admin.py
      - run: python3 tools/test_branding_admin.py
      - run: python3 tools/test_privacy_admin.py
      # The SEO screen, and the one assertion in this repository that no other
      # suite can make: saving one of the nine page editors leaves that
      # document's meta band exactly as it was. Those forms no longer RENDER
      # the meta fields but their documents still hold them, so a *_from_post()
      # that still names the band would blank a title on every save — silently,
      # because an empty string is a valid title. See ADR 0020.
      - run: python3 tools/test_seo_admin.py

  browser:
    name: firefox
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # From Mozilla's tarball rather than apt. On Ubuntu 24.04 `apt install
      # firefox` is a transitional package that pulls the snap, which does not
      # run headless in a runner; and firefox-esr installs a binary called
      # firefox-esr, which every suite below would fail to find and skip over.
      - name: install firefox and geckodriver
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libdbus-glib-1-2 libgtk-3-0t64 libasound2t64
          curl -sSfL -o /tmp/firefox.tar.xz \
            "https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US"
          sudo tar -xJf /tmp/firefox.tar.xz -C /opt
          sudo ln -sf /opt/firefox/firefox /usr/local/bin/firefox
          GD=0.35.0
          curl -sSfL -o /tmp/gd.tar.gz \
            "https://github.com/mozilla/geckodriver/releases/download/v${GD}/geckodriver-v${GD}-linux64.tar.gz"
          sudo tar -xzf /tmp/gd.tar.gz -C /usr/local/bin geckodriver
          sudo chmod +x /usr/local/bin/geckodriver

      - name: pillow
        run: pip install --quiet Pillow

      # test_editor.py calls shutil.which("firefox") — that exact name — and
      # exits 0 with a notice when it is missing. That is right on a laptop and
      # wrong here, where a failed install would turn the suite into a silent
      # pass. So the three names it looks for are required to be present first.
      - name: the browser is really here
        run: |
          set -euo pipefail
          for n in php firefox geckodriver; do
            command -v "$n" || { echo "::error::$n is not on PATH — the browser suites would have skipped"; exit 1; }
          done
          firefox --version
          geckodriver --version | head -1

      # One suite here, and it is worth saying what is NOT here.
      #
      # check_focus, check_dark_mode, check_responsive and check_hover crawl a
      # list of public pages and never signed in, so they never covered the
      # editor even before the split -- they went to tech4time-website-frontend with
      # the pages they were written for. Nothing was lost in the move; what is
      # missing is coverage the admin never had, and it is named in
      # docs/10-development/testing.md rather than left to be discovered.
      - name: browser suite
        run: python3 tools/test_editor.py

      # The accessibility crawl over the SIGNED-IN admin. It belongs in this
      # job rather than "checks" because it needs the same Firefox, and it
      # belongs in CI at all because what it found on its first run -- five
      # rules writing a colour token into the `outline` shorthand, which resets
      # outline-style to none -- is exactly the kind of thing that reads fine
      # in a diff and is invisible until somebody presses Tab.
      - name: admin accessibility
        run: python3 tools/check_admin_a11y.py

      # These leave processes behind when a step is cancelled, and a runner
      # that hangs on to Firefox never finishes.
      - name: clean up
        if: always()
        run: pkill -f geckodriver || true; pkill -f firefox || true
